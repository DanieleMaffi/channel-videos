name: voice
on:
  push:
    paths: ['voice/requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: voice
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q coqui-tts f5-tts soundfile
      - name: Generate
        env:
          COQUI_TOS_AGREED: '1'
        run: python voice/gen.py
      - name: Save the voice files
        run: |
          git config user.name voice-bot
          git config user.email voice-bot@users.noreply.github.com
          git add voice/out
          git diff --cached --quiet || (git commit -m "voice: generated lines" && git pull --rebase -q && git push)
