name: voice
on:
  push:
    paths: ['voice/requests/**', '.github/workflows/voice.yml', 'voice/gen.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: voice
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: [chatterbox, orpheus, edge, xtts, f5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Anything to do?
        id: check
        env:
          ONLY_ENGINE: ${{ matrix.engine }}
        run: echo "n=$(python voice/gen.py --pending)" | tee -a $GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: steps.check.outputs.n != '0'
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-${{ matrix.engine }}-v1
      - name: Install (CPU)
        if: steps.check.outputs.n != '0'
        run: |
          mkdir -p voice/logs
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          # torch 2.8 (2.9+ needs torchcodec, which does not load on the runners)
          printf 'torch==2.8.0\ntorchaudio==2.8.0\n' > /tmp/pin.txt
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu > voice/logs/install-${{ matrix.engine }}.txt 2>&1
          case "${{ matrix.engine }}" in
            xtts) pip install -c /tmp/pin.txt coqui-tts soundfile >> voice/logs/install-xtts.txt 2>&1 ;;
            f5) pip install -c /tmp/pin.txt f5-tts soundfile >> voice/logs/install-f5.txt 2>&1 ;;
            chatterbox) pip install chatterbox-tts faster-whisper num2words --extra-index-url https://download.pytorch.org/whl/cpu >> voice/logs/install-chatterbox.txt 2>&1 ;;
            edge) pip install edge-tts >> voice/logs/install-edge.txt 2>&1 ;;
            orpheus) pip install orpheus-cpp soundfile numpy >> voice/logs/install-orpheus.txt 2>&1 && pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu >> voice/logs/install-orpheus.txt 2>&1 ;;
          esac
          pip uninstall -y torchcodec >> voice/logs/install-${{ matrix.engine }}.txt 2>&1 || true
          case "${{ matrix.engine }}" in edge|orpheus) ;; *) python -c "import torch, torchaudio; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__)" | tee -a voice/logs/install-${{ matrix.engine }}.txt ;; esac
          tail -30 voice/logs/install-${{ matrix.engine }}.txt
      - name: Generate
        if: steps.check.outputs.n != '0'
        env:
          COQUI_TOS_AGREED: '1'
          ONLY_ENGINE: ${{ matrix.engine }}
        run: python voice/gen.py > voice/logs/gen-${{ matrix.engine }}.txt 2>&1
      - name: Save the voice files and logs
        if: always() && steps.check.outputs.n != '0'
        run: |
          for f in voice/logs/*.txt; do tail -c 20000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git config user.name voice-bot
          git config user.email voice-bot@users.noreply.github.com
          git add voice/out voice/logs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "voice: ${{ matrix.engine }} output and log" && git pull --rebase -q && git push)
